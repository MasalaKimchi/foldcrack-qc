[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foldcrack-qc"
version = "0.1.0"
description = "Modality-aware feasibility framework for fold and crack-like artifact QC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "opencv-python>=4.10",
]

[project.optional-dependencies]
wsi = ["tifffile>=2024.8", "zarr>=2.18"]
foundation = ["torch>=2.4", "torchvision>=0.19", "timm>=1.0"]
dev = ["pytest>=8", "coverage>=7", "ruff>=0.8"]

[project.scripts]
foldcrack-qc = "foldcrack_qc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
